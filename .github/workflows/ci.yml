name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Permissions
        run: chmod +x server-security-audit.sh test/smoke.sh

      - name: Syntax check
        run: bash -n server-security-audit.sh

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck

      - name: ShellCheck
        run: shellcheck --severity=warning server-security-audit.sh

      - name: Self test
        run: bash test/smoke.sh

      - name: Run audit as root
        run: sudo bash server-security-audit.sh --color never --no-pass || true

      - name: Validate JSON report
        run: |
          set +e
          bash server-security-audit.sh --format json --color never > audit.json 2> audit.err
          code=$?
          set -e
          echo "audit exit code: $code"
          echo "bytes: $(wc -c < audit.json)"
          echo "--- stderr ---"
          cat audit.err
          echo "--- json ---"
          python3 -c "import json; d=json.load(open('audit.json')); print('tool:', d['tool'], 'version:', d['version'], 'score:', d['score']); print('counts:', d['counts']); print('findings:', len(d['findings']))"
